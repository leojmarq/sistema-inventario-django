{% extends 'inventario/base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-chart-bar"></i> Reportes del Sistema</h4>
            </div>
            <div class="card-body">
                <div class="row">
                    <!-- Reporte de Inventario -->
                    <div class="col-md-6 mb-4">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-file-pdf fa-3x text-danger mb-3"></i>
                                <h5>Reporte de Inventario</h5>
                                <p class="text-muted">Genera un reporte completo de todos los productos en formato PDF</p>
                                
                                <form method="get" action="{% url 'reporte_inventario_pdf' %}" class="mb-3">
                                    <div class="mb-2">
                                        <select name="categoria" class="form-select form-select-sm">
                                            <option value="">Todas las categorías</option>
                                            {% for categoria in categorias %}
                                                <option value="{{ categoria.pk }}">{{ categoria.nombre }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" name="stock_bajo" id="stock_bajo">
                                        <label class="form-check-label" for="stock_bajo">
                                            Solo productos con stock bajo
                                        </label>
                                    </div>
                                    <button type="submit" class="btn btn-danger">
                                        <i class="fas fa-download"></i> Generar PDF
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Logs del Sistema -->
                    <div class="col-md-6 mb-4">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-history fa-3x text-info mb-3"></i>
                                <h5>Logs del Sistema</h5>
                                <p class="text-muted">Consulta el historial de actividades de los usuarios</p>
                                <a href="{% url 'logs_sistema' %}" class="btn btn-info">
                                    <i class="fas fa-eye"></i> Ver Logs
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
